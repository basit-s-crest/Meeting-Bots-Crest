[project]
name = "meeting-memory-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "supabase>=2.5.0",
    "sentence-transformers>=3.0.0",
    "speechbrain>=1.0.0",
    "torchaudio>=2.0.0",
    "groq>=0.9.0",
    "redis>=5.1.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
serve = "app.main:start"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]
